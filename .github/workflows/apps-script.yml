# Met à jour le script Google (Code.gs + Index.html) et son déploiement « Application Web », sans copier-coller.
# Secrets du dépôt à créer une fois : CLASPRC_JSON, SCRIPT_ID, DEPLOYMENT_ID (voir goulottes/LISEZMOI.md).
name: Serveur goulottes (Google Apps Script)

on:
  push:
    branches: [claude/quirky-wright-cswq7t]
    paths: ['goulottes/Code.gs', 'goulottes/Index.html', 'goulottes/appsscript.json', '.github/workflows/apps-script.yml']
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "Secrets CLASPRC_JSON / SCRIPT_ID / DEPLOYMENT_ID absents : étape ignorée (voir goulottes/LISEZMOI.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Envoyer le code et mettre à jour le déploiement
        if: steps.cfg.outputs.ok == 'true'
        working-directory: goulottes
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Auto $(date -u +%Y-%m-%dT%H:%MZ) $GITHUB_SHA"
